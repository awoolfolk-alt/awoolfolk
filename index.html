<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Legend of Andre | Andre Woolfolk Portfolio</title>
  <meta name="description" content="Andre Woolfolk's i.c.stars C60 digital portfolio, told as a game: where I was, where I am, and where I'm going." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS
       Why: every color lives here once. Change a token and the
       whole site updates. This is the same idea as a "theme" in a game.
       ============================================================ */
    :root {
      --night: #070b18;        /* deepest background */
      --navy: #0f1a35;         /* the hero's coat */
      --panel: #131f3f;        /* cards */
      --panel-2: #1a2a52;
      --line: #2a3d6e;
      --gold: #e8b64a;         /* legacy / leadership */
      --gold-soft: #f6d68a;
      --energy: #5ad1ff;       /* after-image blue */
      --text: #eef2fb;
      --muted: #a9b6d6;
      --pixel: "Press Start 2P", monospace;
      --body: "Inter", system-ui, sans-serif;
      --accent: var(--gold);   /* each chapter overrides this */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--night);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.65;
      overflow-x: hidden;
      padding-bottom: 84px; /* room for the journey bar */
    }
    a { color: var(--energy); }
    img { max-width: 100%; }

    /* ============================================================
       TITLE SCREEN
       ============================================================ */
    .title-screen {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      padding: 96px 16px 64px;
    }
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; }
    .layer {
      position: absolute; left: -5%; width: 110%; bottom: 0;
      transition: transform 0.25s ease-out;
      pointer-events: none;
    }
    .layer svg { display: block; width: 100%; height: auto; }

    .title-content { position: relative; z-index: 2; max-width: 820px; }
    .eyebrow {
      font-family: var(--pixel); font-size: 10px; letter-spacing: 2px;
      color: var(--energy); margin-bottom: 20px;
    }
    .game-title {
      font-family: var(--pixel);
      font-size: clamp(22px, 5.4vw, 52px);
      line-height: 1.35;
      color: var(--gold-soft);
      text-shadow: 0 0 18px rgba(232,182,74,0.45), 4px 4px 0 #3a2508;
    }
    .game-title span { display: block; font-size: 0.45em; color: var(--text); margin-top: 14px; text-shadow: 3px 3px 0 #000; }
    .who { margin: 26px auto 6px; font-size: 18px; font-weight: 600; }
    .who-sub { color: var(--muted); font-size: 15px; }
    .quote { margin: 26px auto 0; max-width: 560px; font-style: italic; color: var(--gold-soft); }

    #hero-title { width: 96px; height: 128px; image-rendering: pixelated; margin: 30px auto 4px; display: block; }

    .menu {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 30px;
    }
    .btn {
      font-family: var(--pixel); font-size: 11px; line-height: 1.4;
      padding: 14px 18px;
      color: var(--text); text-decoration: none;
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      cursor: pointer;
    }
    .btn:hover, .btn:focus-visible {
      transform: translate(-2px, -2px) scale(1.03);
      border-color: var(--gold);
      box-shadow: 6px 6px 0 #000, 0 0 18px rgba(232,182,74,0.35);
      outline: none;
    }
    .btn.primary { background: var(--gold); color: #1a1205; border-color: var(--gold-soft); }
    .btn.soon { opacity: 0.55; }
    .btn.soon::after { content: " (soon)"; }

    .contact-line { margin-top: 22px; font-size: 14px; color: var(--muted); }
    .press-start {
      margin-top: 40px; font-family: var(--pixel); font-size: 10px; color: var(--muted);
      animation: blink 1.4s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ============================================================
       WORLD MAP (navigation)
       ============================================================ */
    .world-map {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7,11,24,0.92);
      backdrop-filter: blur(6px);
      border-bottom: 2px solid var(--line);
    }
    .world-map ul {
      list-style: none; display: flex; gap: 4px; overflow-x: auto;
      max-width: 1100px; margin: 0 auto; padding: 10px 16px;
      scrollbar-width: none;
    }
    .world-map a {
      display: block; white-space: nowrap;
      font-family: var(--pixel); font-size: 9px;
      color: var(--muted); text-decoration: none;
      padding: 9px 10px; border: 2px solid transparent;
    }
    .world-map a:hover, .world-map a.active { color: var(--text); border-color: var(--gold); }

    /* ============================================================
       CHAPTERS
       ============================================================ */
    main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .chapter { padding: 88px 0 24px; scroll-margin-top: 50px; }
    .chapter-head { border-left: 6px solid var(--accent); padding-left: 18px; margin-bottom: 28px; }
    .chapter-tag {
      font-family: var(--pixel); font-size: 9px; color: var(--accent);
      letter-spacing: 1px; margin-bottom: 12px;
    }
    .chapter h2 { font-family: var(--pixel); font-size: clamp(16px, 3vw, 24px); line-height: 1.5; }
    .chapter h2 small { display: block; font-family: var(--body); font-size: 15px; font-weight: 500; color: var(--muted); margin-top: 8px; }
    .chapter-intro { max-width: 760px; margin-top: 14px; color: var(--text); }
    .req {
      display: inline-block; margin-top: 14px;
      font-size: 13px; font-weight: 600; color: var(--accent);
      border: 1px solid var(--accent); padding: 4px 10px;
    }

    .group-title { font-family: var(--pixel); font-size: 11px; color: var(--accent); margin: 30px 0 14px; line-height: 1.6; }
    .group-title small { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); margin-top: 6px; }

    .quests { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .quest {
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      border: 2px solid var(--line);
      padding: 20px 20px 18px;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .quest:hover { transform: translateY(-3px); border-color: var(--accent); }
    .quest h3 { font-size: 16px; line-height: 1.4; margin-bottom: 10px; padding-right: 76px; }
    .quest .status {
      position: absolute; top: 18px; right: 16px;
      font-family: var(--pixel); font-size: 8px; padding: 5px 6px;
    }
    .quest.done .status { background: var(--accent); color: #0b0b12; }
    .quest.open .status { border: 1px dashed var(--muted); color: var(--muted); }
    .quest p, .quest li { font-size: 15px; }
    .quest p + p { margin-top: 12px; }
    .quest ul { padding-left: 20px; margin-top: 6px; }
    .quest .prompt { color: var(--muted); font-style: italic; }
    .quest .links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; font-weight: 600; }

    .boss {
      margin: 8px 0 24px; padding: 18px 20px;
      border: 2px solid #b04a6a; background: rgba(176,74,106,0.12);
    }
    .boss b { font-family: var(--pixel); font-size: 10px; color: #ff8fb1; display: block; margin-bottom: 8px; }

    /* Side quest games */
    .quest.game-quest { grid-column: 1 / -1; }
    .game-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
    .game-panel { min-width: 0; padding: 14px; background: rgba(7,11,24,0.45); border: 2px solid var(--line); }
    .game-panel h4 { font-family: var(--pixel); font-size: 9px; line-height: 1.6; color: var(--gold); margin-bottom: 10px; }
    .game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(100%, 220px); margin: 10px 0 14px; }
    .game-cell {
      aspect-ratio: 1; background: #0b1226; border: 2px solid var(--line); border-radius: 0;
      color: var(--gold); font-family: var(--pixel); font-size: 18px; cursor: pointer;
    }
    .game-cell:hover:enabled, .game-cell:focus-visible { border-color: var(--accent); }
    .game-cell:focus-visible, #snake-canvas:focus-visible { outline: 2px solid var(--energy); outline-offset: 2px; }
    .game-cell:disabled { cursor: default; }
    #game-status, #snake-status { min-height: 24px; font-size: 13px; font-weight: 600; color: var(--muted); }
    #snake-canvas { display: block; width: 100%; height: auto; aspect-ratio: 320 / 288; border: 2px solid var(--line); image-rendering: pixelated; touch-action: none; }
    #breakout-status { min-height: 24px; font-size: 13px; font-weight: 600; color: var(--muted); }
    #breakout-canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 10; border: 2px solid var(--line); touch-action: none; }
    #shooter-status { min-height: 24px; font-size: 13px; font-weight: 600; color: var(--muted); }
    #shooter-canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; border: 2px solid var(--line); cursor: crosshair; touch-action: none; }
    #game-reset, #snake-reset, #breakout-reset, #shooter-reset { margin-top: 6px; }

    /* Quest log */
    .log { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
    .log th, .log td { border: 2px solid var(--line); padding: 12px; text-align: left; }
    .log th { font-family: var(--pixel); font-size: 9px; color: var(--gold); background: var(--panel); }
    .bar { height: 10px; background: #0b1226; border: 1px solid var(--line); min-width: 90px; }
    .bar i { display: block; height: 100%; background: var(--gold); }
    .ok { color: var(--gold); font-weight: 700; }

    footer { text-align: center; padding: 60px 16px 30px; color: var(--muted); font-size: 14px; }
    footer .btn { margin: 6px; }

    /* ============================================================
       JOURNEY BAR: the hero runs across as you scroll
       ============================================================ */
    .journey {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      height: 72px;
      background: rgba(7,11,24,0.95);
      border-top: 2px solid var(--line);
    }
    #journey-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .journey-label {
      position: absolute; right: 14px; top: 8px;
      font-family: var(--pixel); font-size: 8px; color: var(--gold);
      pointer-events: none;
    }

    /* Achievement toast */
    .toast {
      position: fixed; left: 50%; bottom: 90px; z-index: 40;
      transform: translate(-50%, 30px); opacity: 0;
      background: var(--panel); border: 2px solid var(--gold);
      box-shadow: 4px 4px 0 #000, 0 0 24px rgba(232,182,74,0.35);
      padding: 12px 18px; text-align: center;
      transition: transform 0.35s, opacity 0.35s;
      pointer-events: none; max-width: calc(100% - 32px);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast b { font-family: var(--pixel); font-size: 8px; color: var(--gold); display: block; margin-bottom: 6px; }
    .toast span { font-size: 14px; font-weight: 600; }

    @media (max-width: 600px) {
      .quests { grid-template-columns: 1fr; }
      .log th, .log td { padding: 8px; font-size: 13px; }
      .game-grid { grid-template-columns: 1fr; }
    }
    @media (min-width: 601px) and (max-width: 900px) {
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .press-start { animation: none; }
      .layer, .quest, .btn { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ============================================================
       HOMEPAGE / TITLE SCREEN
       Required by the assignment: name, contact info, resume, LinkedIn.
       The real links live in PROFILE (in the script below).
       ============================================================ -->
  <header class="title-screen" id="top">
    <canvas id="sky" aria-hidden="true"></canvas>
    <div class="layer" data-depth="12" aria-hidden="true">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="#101b3a" d="M0 220 L120 150 L240 200 L380 110 L520 190 L660 120 L820 210 L980 130 L1120 200 L1280 140 L1440 190 V320 H0Z"/></svg>
    </div>
    <div class="layer" data-depth="24" aria-hidden="true">
      <svg viewBox="0 0 1440 320" preserveAspectRatio="none"><path fill="#0b1430" d="M0 260 Q180 200 360 250 T720 240 T1080 255 T1440 230 V320 H0Z"/></svg>
    </div>

    <div class="title-content">
      <p class="eyebrow">i.c.stars C60 · DIGITAL PORTFOLIO</p>
      <h1 class="game-title">THE LEGEND OF ANDRE<span>RISE OF LEGACY</span></h1>
      <canvas id="hero-title" width="12" height="16" aria-label="Pixel art of the hero: medium-long locks, navy coat, gold accents, sword on his back"></canvas>
      <p class="who" id="who"></p>
      <p class="who-sub" id="who-sub"></p>
      <p class="quote">"Every step forward carries the experiences that came before it."</p>

      <nav class="menu" id="menu" aria-label="Main menu"></nav>
      <p class="contact-line" id="contact-line"></p>
      <p class="press-start" aria-hidden="true">▼ SCROLL TO BEGIN YOUR JOURNEY ▼</p>
    </div>
  </header>

  <nav class="world-map" aria-label="World map">
    <ul id="world-map"></ul>
  </nav>

  <main id="world"></main>

  <footer>
    <div id="footer-links"></div>
    <p style="margin-top:18px">© 2026 Andre Woolfolk · Built with HTML, CSS & JavaScript · Hosted on GitHub Pages</p>
  </footer>

  <div class="journey" aria-hidden="true">
    <canvas id="journey-canvas"></canvas>
    <div class="journey-label" id="journey-label">PROLOGUE</div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"><b>ACHIEVEMENT UNLOCKED</b><span></span></div>

<script>
/* ==================================================================
   PART 1: CONTENT
   Why: ALL of your words live here, separate from the code that
   draws the page. To update your portfolio, you only edit this part.
   The same idea will let your Phaser game read the same story later.

   How a quest works:
     prompt = the question you're answering (shows until you write)
     text   = YOUR answer, in first person. Leave it "" until written.
   When "text" has words, the quest is marked CLEAR and counts
   toward the requirement in the Quest Log automatically.
   ================================================================== */

const PROFILE = {
  name: "Andre Woolfolk",
  title: "Developer in training · Future SOC Analyst · i.c.stars C60",
  email: "awoolfolk@icstars.org",
  github: "https://github.com/awoolfolk-alt",
  linkedin: "https://www.linkedin.com/in/andre-woolfolk-335243121/",
  resume: "",                   // e.g. "assets/Andre-Woolfolk-Resume.pdf"
  game: ""                      // link to the playable game once it's deployed
};

const CHAPTERS = [
  {
    id: "prologue", tag: "PROLOGUE", region: "Forest of Origins", section: "Where I Was",
    accent: "#58c48a",
    intro: "I'm a driven, detail-oriented developer building my skills through i.c.stars, where I'm growing my technical foundation while sharpening the leadership instincts that will define the next stage of my career. As a Black professional in tech, I bring strong problem-solving skills, a commitment to clean, thoughtful code, and a perspective shaped by resilience and the drive to open doors, for myself and for others coming up behind me. Before i.c.stars, I learned my biggest lessons the hard way. In the game, those lessons become the first bosses you face.",
    boss: null,
    groups: [{ min: 0, quests: [
      { title: "The Overload", prompt: "",
        text: "At Nike, I carried the work of two departments. I kept saying yes until I had nothing left. The lesson: <b>set boundaries.</b> In the game, beating The Overload unlocks <i>Leadership Aura</i>." },
      { title: "The Unknown Machine", prompt: "",
        text: "At Empire Cooler, I was supposed to get six months of training and got three. I could have stayed quiet. The lesson: <b>advocate for yourself.</b> In the game, beating The Unknown Machine unlocks <i>Courage Strike</i>." },
      { title: "The Day Before i.c.stars", prompt: "Who were you the day before i.c.stars started? What were you carrying, and what did you want?", text: "I walked into i.c.stars with a Google Cybersecurity Certificate I earned in 2025 while working full time, years of customer service and field experience, and one question: could someone like me build a career protecting people in tech? I didn't have a tech degree, and I didn't see many people who looked like me in the field. I came anyway, because I'd tell any nervous new hire I ever trained that they were more ready than they thought." }
    ]}]
  },

  {
    id: "leadership", tag: "CHAPTER 1 · LEADERSHIP", region: "Leadership Hall", section: "Where I Am",
    accent: "#e8b64a",
    intro: "How I showed up, stepped up, and led, through action, projects, and reflection.",
    groups: [{ min: 5, quests: [
      { title: "Team Week", prompt: "What role did you play on your team? Describe one moment you led, or chose to follow. What would you do differently?", text: "Team Week showed me two things about myself. My relationship skills work well with groups, and my public speaking still needed work. When a few teammates on Team Canary got into a dispute, I realized I didn't yet have the tools to calm it down. So I set a goal for the next 13 weeks: be more proactive with my communication. I practiced my pitch with alumni and staff to break the nerves, and I committed to presenting without saying \"um.\" My first step was simple: speak my mind, with care, in every group conversation." },
      { title: "The Gifts Project", prompt: "What gift did you find in yourself or someone else? What did you deliver?", text: "" },
      { title: "Community Role", prompt: "What was your community role? Name one thing you did that made the cohort better.", text: "" },
      { title: "Feedback & Planetary Responsibility", prompt: "Share one piece of feedback that changed how you work. How did you respond, and what did you do after?", text: "At i.c.stars I named my planetary responsibility: <b>to encourage</b>. To me that means putting courage into people so they can take the next step themselves. I do it through five gifts: empathy, confidence, trust, knowledge, and plain-language communication. The hardest lesson behind it came from Nike. I tried to carry a coworker until I burned out, and I learned that encouraging someone means <i>helping them stand, not carrying them forever</i>." },
      { title: "Tea Host", prompt: "Who was your Tea Guest (role or industry)? How did you prepare? What stuck with you?", text: "<p>As a Tea Host, I welcomed Kevin M. Gates, a fellow i.c.stars alum and Technology Manager for Americas Global Partner Solutions at Microsoft, where he leads a team of Solution Architects helping partners build modern applications with AI and Azure. To prepare, I went beyond his résumé and spent time on dreaddontdie, a personal site he has designed and built himself since 2001. It's home to his photography, which he also shares through Adobe Stock and iStock, along with his music, videos, and a \"vault\" of past projects.</p><p>I was especially drawn to the path that came before tech. Kevin spent about four and a half years as a line cook, first at Bertucci's, where he started as a busboy in high school and worked his way up to the brick-oven pizza station, and then at the House of Blues, where he became a senior line cook. During downtime in that kitchen, he taught himself HTML after learning about i.c.stars. It was the year 2000, when the resources I take for granted today, like online tutorials, video courses, and AI tools, weren't readily available. He built a website for Prologue High School as part of his application and turned it in on a floppy disk.</p><p>After going through my own cycle, I understand how much persistence it takes to learn this work, and I admire how much more it took him to do it with so little to lean on. Like my own years on the Nike sales floor and in the field at Empire Cooler, his story reminds me that the discipline of hands-on work carries straight into technology. His determination has become part of my motivation: if he could build that from a kitchen, I can keep pushing with what I have.</p>", links: [{ label: "Kevin's LinkedIn", url: "https://www.linkedin.com/in/kevinmgates/" }, { label: "dreaddontdie.com", url: "https://www.dreaddontdie.com/" }] },
      { title: "Tea Debriefs", prompt: "One lesson from a debrief or cohort discussion you still think about, and why.", text: "" },
      { title: "Dream Speech", prompt: "What did you dream out loud? Were you recognized as a business, service, or civic leader? Add a quote.", text: "My Dream Speech takes place in Chicago in 2051, where I'm accepting the <b>Courage Builder Award for Community Technology Leadership</b>. It traces my path from the Nike sales floor to SOC Analyst, Threat Intelligence Analyst, Security Engineer, and CISO by 2038. Then it goes home: the Open Door Center, a safe haven I build in an abandoned factory on the far South Side, with cybersecurity classes, mentoring, wellness programs, and recreation for kids who never had them close by.<br><br><i>\"If you have the courage to speak it, you have the power to create it.\"</i>" },
      { title: "CIVICs Project", prompt: "What did your project address? What did you learn, and how will you use it right after the internship?", text: "" }
    ]}]
  },

  {
    id: "business", tag: "CHAPTER 2 · BUSINESS", region: "Consulting Guild", section: "Where I Am",
    accent: "#3fd0c0",
    intro: "My growth as a business thinker and emerging consultant.",
    groups: [{ min: 4, quests: [
      { title: "The Client Project: Medline OPN", prompt: "The Medline Operations Problem Navigator: what business problem it solves, how your team approached it, and your individual role.", text: "" },
      { title: "Forming the Consulting Company", prompt: "Your company name, how you split roles, what was hard, and how you worked through it.", text: "" },
      { title: "The RFP Proposal", prompt: "What the RFP asked for, what you proposed, and your biggest takeaway. Link the deck.", text: "", links: [] },
      { title: "Company Engagement Days", prompt: "Pick one company (Accenture, Salesforce...). What did you learn that changed how you see the industry?", text: "" },
      { title: "Mentors, Clients & Guest Consultants", prompt: "How you received feedback, how you adapted your team's approach, and what you learned about professionalism.", text: "" },
      { title: "Allskates & External Feedback", prompt: "One piece of outside feedback and what you did with it.", text: "" }
    ]}]
  },

  {
    id: "technology", tag: "CHAPTER 3 · TECHNOLOGY", region: "Innovation Forge", section: "Where I Am",
    accent: "#ff9a4a",
    intro: "What I built, how I built it, and what I learned along the way.",
    groups: [{ min: 5, quests: [
      { title: "Web App Walkthrough: The Legend of Andre", prompt: "",
        text: "My portfolio is also a playable game. <b>The problem it solves:</b> recruiters see hundreds of portfolios that look the same, so this one lets them <i>experience</i> my story.<ul><li><b>Stack:</b> Next.js, TypeScript, Tailwind CSS, Phaser 3, Framer Motion</li><li>A combat input system that buffers keys so attacks feel responsive</li><li>A 3-hit combo on SPACE (left, right, left) that scales 25 / 35 / 45 / 65 damage by level</li><li>A two-part heavy attack on LEFT CLICK: an overhead slam, then an upward launch</li><li>A dash on SHIFT with after-images and a short invulnerability window</li><li>One reusable dialogue system for every NPC and story moment</li></ul>",
        links: [{ label: "Game repo", url: "" }, { label: "Play it", url: "" }] },
      { title: "Geek Week", prompt: "SQL, Excel, and hot keys: starting score vs. ending score. What did coaching show you about how you learn?", text: "" },
      { title: "When Coding \"Clicked\"", prompt: "The exact moment something made sense, or the bug that almost beat you and how you beat it.", text: "" },
      { title: "Debugging & Asking Good Questions", prompt: "What did a bad question from you look like in week 1? What does a good one look like now?", text: "" },
      { title: "GitHub, Branching & Version Control", prompt: "How your team used branches and pull requests. Link a PR you're proud of.", text: "" },

/* ==================================================================
   PART 2: BUILDING THE PAGE FROM THE CONTENT
   Why: one function draws every chapter. Without it you'd copy and
   paste the same HTML 40 times, and fixing one typo in the layout
   would mean fixing it 40 times.
   ================================================================== */

const $ = (sel) => document.querySelector(sel);
const isDone = (q) => q.text.trim().length > 0;

// Turns a link into a button, or a dimmed "soon" button if the URL is empty.
// Why: the assignment says to test every link. This makes a broken link impossible.
function linkButton(label, url, primary) {
  if (!url) return `<span class="btn soon" aria-disabled="true">${label}</span>`;
  const ext = url.startsWith("http") ? ' target="_blank" rel="noopener"' : "";
  return `<a class="btn${primary ? " primary" : ""}" href="${url}"${ext}>${label}</a>`;
}

function renderHome() {
  $("#who").textContent = PROFILE.name;
  $("#who-sub").textContent = PROFILE.title;
  $("#menu").innerHTML =
    `<a class="btn primary" href="#prologue">New Adventure</a>` +
    linkButton("Play the Game", PROFILE.game) +
    linkButton("Resume", PROFILE.resume) +
    linkButton("LinkedIn", PROFILE.linkedin) +
    linkButton("GitHub", PROFILE.github);
  $("#contact-line").innerHTML = `Contact: <a href="mailto:${PROFILE.email}">${PROFILE.email}</a>`;
  $("#footer-links").innerHTML =
    `<a class="btn" href="mailto:${PROFILE.email}">Email Me</a>` +
    linkButton("LinkedIn", PROFILE.linkedin) +
    linkButton("Resume", PROFILE.resume) +
    `<a class="btn" href="#top">Back to Title</a>`;
}

function renderQuest(q) {
  const done = isDone(q);
  const links = (q.links || []).filter(l => l.url)
    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`).join("");
  return `
    <article class="quest ${q.bonus ? "game-quest" : ""} ${done ? "done" : "open"}">
      <span class="status">${q.bonus ? "BONUS" : done ? "CLEAR" : "IN PROGRESS"}</span>
      <h3>${q.title}</h3>
      ${done ? `<div>${q.text}</div>` : `<p class="prompt">${q.prompt}</p>`}
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
}

function renderChapter(ch) {
  const groupsHtml = ch.groups.map(g => `
    ${g.name ? `<h3 class="group-title">${g.name}<small>${g.sub} · complete at least ${g.min}</small></h3>` : ""}
    <div class="quests">${g.quests.map(renderQuest).join("")}</div>
  `).join("");

  const mainMin = ch.groups.length === 1 ? ch.groups[0].min : 0;
  const total = ch.groups.reduce((n, g) => n + g.quests.filter(q => !q.bonus).length, 0);

  return `
    <section class="chapter" id="${ch.id}" style="--accent:${ch.accent}" data-label="${ch.tag}" data-region="${ch.region}">
      <div class="chapter-head">
        <p class="chapter-tag">${ch.tag} · ${ch.section.toUpperCase()}</p>
        <h2>${ch.region}<small>${ch.section}</small></h2>
        <p class="chapter-intro">${ch.intro}</p>
        ${mainMin ? `<span class="req">Quest requirement: ${mainMin} of ${total}</span>` : ""}
      </div>
      ${ch.boss ? `<div class="boss"><b>${ch.boss.name}</b>${ch.boss.text}</div>` : ""}
      ${groupsHtml}
    </section>`;
}

// The Quest Log counts finished quests and compares them to the minimums.
// Why: it's your submission checklist, and it updates itself as you write.
function renderQuestLog() {
  const rows = [];
  CHAPTERS.forEach(ch => ch.groups.forEach(g => {
    if (!g.min) return;
    const done = g.quests.filter(q => !q.bonus && isDone(q)).length;
    const label = g.name ? `${ch.region}: ${g.name}` : `${ch.region} (${ch.tag.split("· ")[1] || ch.tag})`;
    const pct = Math.min(100, Math.round(done / g.min * 100));
    rows.push(`<tr><td>${label}</td><td>${done} / ${g.min}</td>
      <td><div class="bar"><i style="width:${pct}%"></i></div></td>
      <td>${done >= g.min ? '<span class="ok">CLEAR</span>' : "In progress"}</td></tr>`);
  }));
  return `
    <section class="chapter" id="quest-log" style="--accent:#e8b64a" data-label="QUEST LOG" data-region="Quest Log">
      <div class="chapter-head">
        <p class="chapter-tag">QUEST LOG · DUE 11/23/2026</p>
        <h2>Journey Progress<small>Every section's requirement, tracked automatically</small></h2>
      </div>
      <div style="overflow-x:auto">
        <table class="log">
          <thead><tr><th>Region</th><th>Quests</th><th>Progress</th><th>Status</th></tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      </div>
    </section>`;
}

function renderWorld() {
  $("#world").innerHTML = CHAPTERS.map(renderChapter).join("") + renderQuestLog();
  $("#world-map").innerHTML = [...CHAPTERS, { id: "quest-log", region: "Quest Log" }]
    .map(ch => `<li><a href="#${ch.id}">${ch.region}</a></li>`).join("");
}


/* ==================================================================
   PART 3: THE HERO (pixel art drawn from text)
   Why: each letter is one pixel color. Drawing the hero from a map
   means you can redesign him by editing letters, no art app needed.
   It's the same idea as a sprite sheet in Phaser.
   ================================================================== */

const COLORS = {
  H: "#1a1108", // locks
  S: "#8a5a3c", // skin
  K: "#0b0b12", // eyes, boots
  N: "#1f3466", // navy coat
  G: "#e8b64a", // gold accents
  W: "#dfe8f2"  // blade
};
const BODY = [
  "....HHHH....",
  "...HHHHHH...",
  "..HHSSSSHH..",
  "..HHSKSKHH..",
  "..HHSSSSHH.W",
  ".HH.SSSS.HHW",
  ".H.GNNNNG.HW",
  ".H.NNGGNN..W",
  "..NNNGGNNN.G",
  "..SNNNNNNS..",
  "...NNNNNN...",
  "...NNGGNN..."
];
const LEGS = [
  ["...NN..NN...", "...NN..NN...", "...KK..KK...", "..KKK..KKK.."],  // standing
  ["...NN.NN....", "..NN...NN...", "..KK....KK..", ".KKK....KKK."]   // running
];

function drawHero(ctx, x, y, frame, scale, tint, alpha) {
  const rows = BODY.concat(LEGS[frame]);
  ctx.globalAlpha = alpha;
  rows.forEach((row, ry) => {
    [...row].forEach((c, rx) => {
      if (c === ".") return;
      ctx.fillStyle = tint || COLORS[c];
      ctx.fillRect(Math.round(x + rx * scale), Math.round(y + ry * scale), scale, scale);
    });
  });
  ctx.globalAlpha = 1;
}

function drawTitleHero() {
  const ctx = $("#hero-title").getContext("2d");
  drawHero(ctx, 0, 0, 0, 1, null, 1);
}


/* ==================================================================
   PART 4: THE JOURNEY BAR + AFTER-IMAGES
   Why: scrolling IS the journey. As you scroll, the hero runs across
   the bar and leaves after-images behind him, just like in the game.
   They turn gold once he reaches the Future Kingdom: growth you can see.
   ================================================================== */

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const jc = $("#journey-canvas");
const jctx = jc.getContext("2d");
let heroX = 0, targetX = 0, trail = [], frame = 0, frameTick = 0;
const SCALE = 3, HERO_W = 12 * SCALE;

function sizeJourney() {
  jc.width = jc.clientWidth;
  jc.height = jc.clientHeight;
}

function scrollProgress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

function journeyLoop() {
  const w = jc.width, h = jc.height;
  const pad = 24;
  targetX = pad + scrollProgress() * (w - pad * 2 - HERO_W);

  // Ease toward the target so the hero runs instead of teleporting.
  const prev = heroX;
  heroX += (targetX - heroX) * (reduceMotion ? 1 : 0.12);
  const moving = Math.abs(heroX - prev) > 0.4;

  // createAfterImage(): remember where he was, then fade it out.
  if (moving && !reduceMotion) trail.push({ x: prev, life: 1 });
  trail.forEach(t => t.life -= 0.06);
  trail = trail.filter(t => t.life > 0).slice(-6);

  if (moving && ++frameTick % 6 === 0) frame = 1 - frame;
  if (!moving) frame = 0;

  // Draw ground, chapter markers, ghosts, then the hero on top.
  jctx.clearRect(0, 0, w, h);
  const groundY = h - 10;
  jctx.fillStyle = "#1a2a52";
  jctx.fillRect(pad, groundY, w - pad * 2, 3);
  jctx.fillStyle = "#e8b64a";
  jctx.fillRect(pad, groundY, heroX - pad + HERO_W / 2, 3);

  const golden = scrollProgress() > 0.78;
  const ghostColor = golden ? "#e8b64a" : "#5ad1ff";
  trail.forEach(t => drawHero(jctx, t.x, groundY - 16 * SCALE, frame, SCALE, ghostColor, t.life * 0.35));
  drawHero(jctx, heroX, groundY - 16 * SCALE, frame, SCALE, null, 1);

  requestAnimationFrame(journeyLoop);
}


/* ==================================================================
   PART 5: TITLE SCREEN MOTION (particles + cursor parallax)
   Why: nothing in the world is static. Particles drift, and the
   mountains shift with your mouse to fake 3D depth.
   ================================================================== */

function startSky() {
  const c = $("#sky"), ctx = c.getContext("2d");
  let parts = [];
  const resize = () => {
    c.width = c.clientWidth; c.height = c.clientHeight;
    parts = Array.from({ length: Math.min(90, Math.floor(c.width / 14)) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 2 + 0.5, v: Math.random() * 0.3 + 0.1,
      gold: Math.random() < 0.25
    }));
  };
  resize(); addEventListener("resize", resize);

  (function tick() {
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, "#070b18"); g.addColorStop(1, "#16234a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    parts.forEach(p => {
      if (!reduceMotion) { p.y -= p.v; if (p.y < -4) { p.y = c.height + 4; p.x = Math.random() * c.width; } }
      ctx.fillStyle = p.gold ? "rgba(232,182,74,0.8)" : "rgba(90,209,255,0.6)";
      ctx.fillRect(p.x, p.y, p.r, p.r);
    });
    requestAnimationFrame(tick);
  })();

  if (!reduceMotion) {
    addEventListener("mousemove", (e) => {
      const dx = e.clientX / innerWidth - 0.5;
      document.querySelectorAll(".layer").forEach(l => {
        l.style.transform = `translateX(${dx * -l.dataset.depth}px)`;
      });
    });
  }
}


/* ==================================================================
   PART 6: ACHIEVEMENTS + MAP HIGHLIGHT
   Why: an IntersectionObserver tells us when a chapter scrolls into
   view, so we can unlock an achievement once per chapter.
   ================================================================== */

function startObservers() {
  const seen = new Set();
  const toast = $("#toast");
  let timer;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.id;
      $("#journey-label").textContent = en.target.dataset.label;
      document.querySelectorAll(".world-map a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + id));
      if (!seen.has(id)) {
        seen.add(id);
        toast.querySelector("span").textContent = "Entered: " + en.target.dataset.region;
        toast.classList.add("show");
        clearTimeout(timer);
        timer = setTimeout(() => toast.classList.remove("show"), 2200);
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll(".chapter").forEach(s => io.observe(s));
}


/* ==================================================================
   START THE GAME
   ================================================================== */
renderHome();
renderWorld();
drawTitleHero();
sizeJourney();
addEventListener("resize", sizeJourney);
journeyLoop();
startSky();
startObservers();
</script>
