<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Legend of Andre | Andre Woolfolk Portfolio</title>
  <meta name="description" content="Andre Woolfolk's i.c.stars C60 digital portfolio, told as a game: where I was, where I am, and where I'm going." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       DESIGN TOKENS
       Why: every color lives here once. Change a token and the
       whole site updates. This is the same idea as a "theme" in a game.
       ============================================================ */
    :root {
      --night: #070b18;        /* deepest background */
      --navy: #0f1a35;         /* the hero's coat */
      --panel: #131f3f;        /* cards */
      --panel-2: #1a2a52;
      --line: #2a3d6e;
      --gold: #e8b64a;         /* legacy / leadership */
      --gold-soft: #f6d68a;
      --energy: #5ad1ff;       /* after-image blue */
      --text: #eef2fb;
      --muted: #a9b6d6;
      --pixel: "Press Start 2P", monospace;
      --body: "Inter", system-ui, sans-serif;
      --accent: var(--gold);   /* each chapter overrides this */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--night);
      color: var(--text);
      font-family: var(--body);
      line-height: 1.65;
      overflow-x: hidden;
      padding-bottom: 84px; /* room for the journey bar */
    }
    a { color: var(--energy); }
    img { max-width: 100%; }

    /* ============================================================
       TITLE SCREEN
       ============================================================ */
    .title-screen {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      overflow: hidden;
      padding: 96px 16px 64px;
    }
    #sky { position: absolute; inset: 0; width: 100%; height: 100%; }
    .layer {
      position: absolute; left: -5%; width: 110%; bottom: 0;
      transition: transform 0.25s ease-out;
      pointer-events: none;
    }
    .layer svg { display: block; width: 100%; height: auto; }

    .title-content { position: relative; z-index: 2; max-width: 820px; }
    .eyebrow {
      font-family: var(--pixel); font-size: 10px; letter-spacing: 2px;
      color: var(--energy); margin-bottom: 20px;
    }
    .game-title {
      font-family: var(--pixel);
      font-size: clamp(22px, 5.4vw, 52px);
      line-height: 1.35;
      color: var(--gold-soft);
      text-shadow: 0 0 18px rgba(232,182,74,0.45), 4px 4px 0 #3a2508;
    }
    .game-title span { display: block; font-size: 0.45em; color: var(--text); margin-top: 14px; text-shadow: 3px 3px 0 #000; }
    .who { margin: 26px auto 6px; font-size: 18px; font-weight: 600; }
    .who-sub { color: var(--muted); font-size: 15px; }
    .quote { margin: 26px auto 0; max-width: 560px; font-style: italic; color: var(--gold-soft); }

    #hero-title { width: 96px; height: 128px; image-rendering: pixelated; margin: 30px auto 4px; display: block; }

    .menu {
      display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
      margin-top: 30px;
    }
    .btn {
      font-family: var(--pixel); font-size: 11px; line-height: 1.4;
      padding: 14px 18px;
      color: var(--text); text-decoration: none;
      background: var(--panel);
      border: 2px solid var(--line);
      box-shadow: 4px 4px 0 #000;
      transition: transform 0.12s, border-color 0.12s, box-shadow 0.12s;
      cursor: pointer;
    }
    .btn:hover, .btn:focus-visible {
      transform: translate(-2px, -2px) scale(1.03);
      border-color: var(--gold);
      box-shadow: 6px 6px 0 #000, 0 0 18px rgba(232,182,74,0.35);
      outline: none;
    }
    .btn.primary { background: var(--gold); color: #1a1205; border-color: var(--gold-soft); }
    .btn.soon { opacity: 0.55; }
    .btn.soon::after { content: " (soon)"; }

    .contact-line { margin-top: 22px; font-size: 14px; color: var(--muted); }
    .press-start {
      margin-top: 40px; font-family: var(--pixel); font-size: 10px; color: var(--muted);
      animation: blink 1.4s steps(2) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ============================================================
       WORLD MAP (navigation)
       ============================================================ */
    .world-map {
      position: sticky; top: 0; z-index: 20;
      background: rgba(7,11,24,0.92);
      backdrop-filter: blur(6px);
      border-bottom: 2px solid var(--line);
    }
    .world-map ul {
      list-style: none; display: flex; gap: 4px; overflow-x: auto;
      max-width: 1100px; margin: 0 auto; padding: 10px 16px;
      scrollbar-width: none;
    }
    .world-map a {
      display: block; white-space: nowrap;
      font-family: var(--pixel); font-size: 9px;
      color: var(--muted); text-decoration: none;
      padding: 9px 10px; border: 2px solid transparent;
    }
    .world-map a:hover, .world-map a.active { color: var(--text); border-color: var(--gold); }

    /* ============================================================
       CHAPTERS
       ============================================================ */
    main { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
    .chapter { padding: 88px 0 24px; scroll-margin-top: 50px; }
    .chapter-head { border-left: 6px solid var(--accent); padding-left: 18px; margin-bottom: 28px; }
    .chapter-tag {
      font-family: var(--pixel); font-size: 9px; color: var(--accent);
      letter-spacing: 1px; margin-bottom: 12px;
    }
    .chapter h2 { font-family: var(--pixel); font-size: clamp(16px, 3vw, 24px); line-height: 1.5; }
    .chapter h2 small { display: block; font-family: var(--body); font-size: 15px; font-weight: 500; color: var(--muted); margin-top: 8px; }
    .chapter-intro { max-width: 760px; margin-top: 14px; color: var(--text); }
    .req {
      display: inline-block; margin-top: 14px;
      font-size: 13px; font-weight: 600; color: var(--accent);
      border: 1px solid var(--accent); padding: 4px 10px;
    }

    .group-title { font-family: var(--pixel); font-size: 11px; color: var(--accent); margin: 30px 0 14px; line-height: 1.6; }
    .group-title small { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); margin-top: 6px; }

    .quests { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .quest {
      background: linear-gradient(160deg, var(--panel-2), var(--panel));
      border: 2px solid var(--line);
      padding: 20px 20px 18px;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }
    .quest:hover { transform: translateY(-3px); border-color: var(--accent); }
    .quest h3 { font-size: 16px; line-height: 1.4; margin-bottom: 10px; padding-right: 76px; }
    .quest .status {
      position: absolute; top: 18px; right: 16px;
      font-family: var(--pixel); font-size: 8px; padding: 5px 6px;
    }
    .quest.done .status { background: var(--accent); color: #0b0b12; }
    .quest.open .status { border: 1px dashed var(--muted); color: var(--muted); }
    .quest p, .quest li { font-size: 15px; }
    .quest ul { padding-left: 20px; margin-top: 6px; }
    .quest .prompt { color: var(--muted); font-style: italic; }
    .quest .links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; font-size: 14px; font-weight: 600; }

    .boss {
      margin: 8px 0 24px; padding: 18px 20px;
      border: 2px solid #b04a6a; background: rgba(176,74,106,0.12);
    }
    .boss b { font-family: var(--pixel); font-size: 10px; color: #ff8fb1; display: block; margin-bottom: 8px; }

    /* Side quest: tic-tac-toe (logic lives in game.js) */
    .game-board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: min(100%, 220px); margin: 10px 0 14px; }
    .game-cell {
      aspect-ratio: 1; background: #0b1226; border: 2px solid var(--line);
      color: var(--gold); font-family: var(--pixel); font-size: 18px; cursor: pointer;
    }
    .game-cell:hover:enabled { border-color: var(--accent); }
    #game-status { font-weight: 600; }

    /* Quest log */
    .log { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
    .log th, .log td { border: 2px solid var(--line); padding: 12px; text-align: left; }
    .log th { font-family: var(--pixel); font-size: 9px; color: var(--gold); background: var(--panel); }
    .bar { height: 10px; background: #0b1226; border: 1px solid var(--line); min-width: 90px; }
    .bar i { display: block; height: 100%; background: var(--gold); }
    .ok { color: var(--gold); font-weight: 700; }

    footer { text-align: center; padding: 60px 16px 30px; color: var(--muted); font-size: 14px; }
    footer .btn { margin: 6px; }

    /* ============================================================
       JOURNEY BAR: the hero runs across as you scroll
       ============================================================ */
    .journey {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      height: 72px;
      background: rgba(7,11,24,0.95);
      border-top: 2px solid var(--line);
    }
    #journey-canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .journey-label {
      position: absolute; right: 14px; top: 8px;
      font-family: var(--pixel); font-size: 8px; color: var(--gold);
      pointer-events: none;
    }

    /* Achievement toast */
    .toast {
      position: fixed; left: 50%; bottom: 90px; z-index: 40;
      transform: translate(-50%, 30px); opacity: 0;
      background: var(--panel); border: 2px solid var(--gold);
      box-shadow: 4px 4px 0 #000, 0 0 24px rgba(232,182,74,0.35);
      padding: 12px 18px; text-align: center;
      transition: transform 0.35s, opacity 0.35s;
      pointer-events: none; max-width: calc(100% - 32px);
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    .toast b { font-family: var(--pixel); font-size: 8px; color: var(--gold); display: block; margin-bottom: 6px; }
    .toast span { font-size: 14px; font-weight: 600; }

    @media (max-width: 600px) {
      .quests { grid-template-columns: 1fr; }
      .log th, .log td { padding: 8px; font-size: 13px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .press-start { animation: none; }
      .layer, .quest, .btn { transition: none; }
    }
  </style>
</head>

/* ==================================================================
   PART 2: BUILDING THE PAGE FROM THE CONTENT
   Why: one function draws every chapter. Without it you'd copy and
   paste the same HTML 40 times, and fixing one typo in the layout
   would mean fixing it 40 times.
   ================================================================== */

const $ = (sel) => document.querySelector(sel);
const isDone = (q) => q.text.trim().length > 0;

// Turns a link into a button, or a dimmed "soon" button if the URL is empty.
// Why: the assignment says to test every link. This makes a broken link impossible.
function linkButton(label, url, primary) {
  if (!url) return `<span class="btn soon" aria-disabled="true">${label}</span>`;
  const ext = url.startsWith("http") ? ' target="_blank" rel="noopener"' : "";
  return `<a class="btn${primary ? " primary" : ""}" href="${url}"${ext}>${label}</a>`;
}

function renderHome() {
  $("#who").textContent = PROFILE.name;
  $("#who-sub").textContent = PROFILE.title;
  $("#menu").innerHTML =
    `<a class="btn primary" href="#prologue">New Adventure</a>` +
    linkButton("Play the Game", PROFILE.game) +
    linkButton("Resume", PROFILE.resume) +
    linkButton("LinkedIn", PROFILE.linkedin) +
    linkButton("GitHub", PROFILE.github);
  $("#contact-line").innerHTML = `Contact: <a href="mailto:${PROFILE.email}">${PROFILE.email}</a>`;
  $("#footer-links").innerHTML =
    `<a class="btn" href="mailto:${PROFILE.email}">Email Me</a>` +
    linkButton("LinkedIn", PROFILE.linkedin) +
    linkButton("Resume", PROFILE.resume) +
    `<a class="btn" href="#top">Back to Title</a>`;
}

function renderQuest(q) {
  const done = isDone(q);
  const links = (q.links || []).filter(l => l.url)
    .map(l => `<a href="${l.url}" target="_blank" rel="noopener">${l.label} →</a>`).join("");
  return `
    <article class="quest ${done ? "done" : "open"}">
      <span class="status">${q.bonus ? "BONUS" : done ? "CLEAR" : "IN PROGRESS"}</span>
      <h3>${q.title}</h3>
      ${done ? `<div>${q.text}</div>` : `<p class="prompt">${q.prompt}</p>`}
      ${links ? `<div class="links">${links}</div>` : ""}
    </article>`;
}

function renderChapter(ch) {
  const groupsHtml = ch.groups.map(g => `
    ${g.name ? `<h3 class="group-title">${g.name}<small>${g.sub} · complete at least ${g.min}</small></h3>` : ""}
    <div class="quests">${g.quests.map(renderQuest).join("")}</div>
  `).join("");

  const mainMin = ch.groups.length === 1 ? ch.groups[0].min : 0;
  const total = ch.groups.reduce((n, g) => n + g.quests.filter(q => !q.bonus).length, 0);

  return `
    <section class="chapter" id="${ch.id}" style="--accent:${ch.accent}" data-label="${ch.tag}" data-region="${ch.region}">
      <div class="chapter-head">
        <p class="chapter-tag">${ch.tag} · ${ch.section.toUpperCase()}</p>
        <h2>${ch.region}<small>${ch.section}</small></h2>
        <p class="chapter-intro">${ch.intro}</p>
        ${mainMin ? `<span class="req">Quest requirement: ${mainMin} of ${total}</span>` : ""}
      </div>
      ${ch.boss ? `<div class="boss"><b>${ch.boss.name}</b>${ch.boss.text}</div>` : ""}
      ${groupsHtml}
    </section>`;
}

// The Quest Log counts finished quests and compares them to the minimums.
// Why: it's your submission checklist, and it updates itself as you write.
function renderQuestLog() {
  const rows = [];
  CHAPTERS.forEach(ch => ch.groups.forEach(g => {
    if (!g.min) return;
    const done = g.quests.filter(q => !q.bonus && isDone(q)).length;
    const label = g.name ? `${ch.region}: ${g.name}` : `${ch.region} (${ch.tag.split("· ")[1] || ch.tag})`;
    const pct = Math.min(100, Math.round(done / g.min * 100));
    rows.push(`<tr><td>${label}</td><td>${done} / ${g.min}</td>
      <td><div class="bar"><i style="width:${pct}%"></i></div></td>
      <td>${done >= g.min ? '<span class="ok">CLEAR</span>' : "In progress"}</td></tr>`);
  }));
  return `
    <section class="chapter" id="quest-log" style="--accent:#e8b64a" data-label="QUEST LOG" data-region="Quest Log">
      <div class="chapter-head">
        <p class="chapter-tag">QUEST LOG · DUE 11/23/2026</p>
        <h2>Journey Progress<small>Every section's requirement, tracked automatically</small></h2>
      </div>
      <div style="overflow-x:auto">
        <table class="log">
          <thead><tr><th>Region</th><th>Quests</th><th>Progress</th><th>Status</th></tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      </div>
    </section>`;
}

function renderWorld() {
  $("#world").innerHTML = CHAPTERS.map(renderChapter).join("") + renderQuestLog();
  $("#world-map").innerHTML = [...CHAPTERS, { id: "quest-log", region: "Quest Log" }]
    .map(ch => `<li><a href="#${ch.id}">${ch.region}</a></li>`).join("");
}


/* ==================================================================
   PART 3: THE HERO (pixel art drawn from text)
   Why: each letter is one pixel color. Drawing the hero from a map
   means you can redesign him by editing letters, no art app needed.
   It's the same idea as a sprite sheet in Phaser.
   ================================================================== */

const COLORS = {
  H: "#1a1108", // locks
  S: "#8a5a3c", // skin
  K: "#0b0b12", // eyes, boots
  N: "#1f3466", // navy coat
  G: "#e8b64a", // gold accents
  W: "#dfe8f2"  // blade
};
const BODY = [
  "....HHHH....",
  "...HHHHHH...",
  "..HHSSSSHH..",
  "..HHSKSKHH..",
  "..HHSSSSHH.W",
  ".HH.SSSS.HHW",
  ".H.GNNNNG.HW",
  ".H.NNGGNN..W",
  "..NNNGGNNN.G",
  "..SNNNNNNS..",
  "...NNNNNN...",
  "...NNGGNN..."
];
const LEGS = [
  ["...NN..NN...", "...NN..NN...", "...KK..KK...", "..KKK..KKK.."],  // standing
  ["...NN.NN....", "..NN...NN...", "..KK....KK..", ".KKK....KKK."]   // running
];

function drawHero(ctx, x, y, frame, scale, tint, alpha) {
  const rows = BODY.concat(LEGS[frame]);
  ctx.globalAlpha = alpha;
  rows.forEach((row, ry) => {
    [...row].forEach((c, rx) => {
      if (c === ".") return;
      ctx.fillStyle = tint || COLORS[c];
      ctx.fillRect(Math.round(x + rx * scale), Math.round(y + ry * scale), scale, scale);
    });
  });
  ctx.globalAlpha = 1;
}

function drawTitleHero() {
  const ctx = $("#hero-title").getContext("2d");
  drawHero(ctx, 0, 0, 0, 1, null, 1);
}


/* ==================================================================
   PART 4: THE JOURNEY BAR + AFTER-IMAGES
   Why: scrolling IS the journey. As you scroll, the hero runs across
   the bar and leaves after-images behind him, just like in the game.
   They turn gold once he reaches the Future Kingdom: growth you can see.
   ================================================================== */

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const jc = $("#journey-canvas");
const jctx = jc.getContext("2d");
let heroX = 0, targetX = 0, trail = [], frame = 0, frameTick = 0;
const SCALE = 3, HERO_W = 12 * SCALE;

function sizeJourney() {
  jc.width = jc.clientWidth;
  jc.height = jc.clientHeight;
}

function scrollProgress() {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
}

function journeyLoop() {
  const w = jc.width, h = jc.height;
  const pad = 24;
  targetX = pad + scrollProgress() * (w - pad * 2 - HERO_W);

  // Ease toward the target so the hero runs instead of teleporting.
  const prev = heroX;
  heroX += (targetX - heroX) * (reduceMotion ? 1 : 0.12);
  const moving = Math.abs(heroX - prev) > 0.4;

  // createAfterImage(): remember where he was, then fade it out.
  if (moving && !reduceMotion) trail.push({ x: prev, life: 1 });
  trail.forEach(t => t.life -= 0.06);
  trail = trail.filter(t => t.life > 0).slice(-6);

  if (moving && ++frameTick % 6 === 0) frame = 1 - frame;
  if (!moving) frame = 0;

  // Draw ground, chapter markers, ghosts, then the hero on top.
  jctx.clearRect(0, 0, w, h);
  const groundY = h - 10;
  jctx.fillStyle = "#1a2a52";
  jctx.fillRect(pad, groundY, w - pad * 2, 3);
  jctx.fillStyle = "#e8b64a";
  jctx.fillRect(pad, groundY, heroX - pad + HERO_W / 2, 3);

  const golden = scrollProgress() > 0.78;
  const ghostColor = golden ? "#e8b64a" : "#5ad1ff";
  trail.forEach(t => drawHero(jctx, t.x, groundY - 16 * SCALE, frame, SCALE, ghostColor, t.life * 0.35));
  drawHero(jctx, heroX, groundY - 16 * SCALE, frame, SCALE, null, 1);

  requestAnimationFrame(journeyLoop);
}


/* ==================================================================
   PART 5: TITLE SCREEN MOTION (particles + cursor parallax)
   Why: nothing in the world is static. Particles drift, and the
   mountains shift with your mouse to fake 3D depth.
   ================================================================== */

function startSky() {
  const c = $("#sky"), ctx = c.getContext("2d");
  let parts = [];
  const resize = () => {
    c.width = c.clientWidth; c.height = c.clientHeight;
    parts = Array.from({ length: Math.min(90, Math.floor(c.width / 14)) }, () => ({
      x: Math.random() * c.width, y: Math.random() * c.height,
      r: Math.random() * 2 + 0.5, v: Math.random() * 0.3 + 0.1,
      gold: Math.random() < 0.25
    }));
  };
  resize(); addEventListener("resize", resize);

  (function tick() {
    const g = ctx.createLinearGradient(0, 0, 0, c.height);
    g.addColorStop(0, "#070b18"); g.addColorStop(1, "#16234a");
    ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height);
    parts.forEach(p => {
      if (!reduceMotion) { p.y -= p.v; if (p.y < -4) { p.y = c.height + 4; p.x = Math.random() * c.width; } }
      ctx.fillStyle = p.gold ? "rgba(232,182,74,0.8)" : "rgba(90,209,255,0.6)";
      ctx.fillRect(p.x, p.y, p.r, p.r);
    });
    requestAnimationFrame(tick);
  })();

  if (!reduceMotion) {
    addEventListener("mousemove", (e) => {
      const dx = e.clientX / innerWidth - 0.5;
      document.querySelectorAll(".layer").forEach(l => {
        l.style.transform = `translateX(${dx * -l.dataset.depth}px)`;
      });
    });
  }
}


/* ==================================================================
   PART 6: ACHIEVEMENTS + MAP HIGHLIGHT
   Why: an IntersectionObserver tells us when a chapter scrolls into
   view, so we can unlock an achievement once per chapter.
   ================================================================== */

function startObservers() {
  const seen = new Set();
  const toast = $("#toast");
  let timer;
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const id = en.target.id;
      $("#journey-label").textContent = en.target.dataset.label;
      document.querySelectorAll(".world-map a").forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + id));
      if (!seen.has(id)) {
        seen.add(id);
        toast.querySelector("span").textContent = "Entered: " + en.target.dataset.region;
        toast.classList.add("show");
        clearTimeout(timer);
        timer = setTimeout(() => toast.classList.remove("show"), 2200);
      }
    });
  }, { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll(".chapter").forEach(s => io.observe(s));
}


/* ==================================================================
   START THE GAME
   ================================================================== */
renderHome();
renderWorld();
drawTitleHero();
sizeJourney();
addEventListener("resize", sizeJourney);
journeyLoop();
startSky();
startObservers();
</script>
<script src="game.js" defer></script>
</body>
</html>
